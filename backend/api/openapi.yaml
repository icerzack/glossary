openapi: 3.0.3
info:
  title: Glossary API
  description: API for managing technical terms and their semantic relationships
  version: 1.0.0
  contact:
    name: API Support
    email: support@glossary.example.com

servers:
  - url: http://localhost:8080/api
    description: Development server
  - url: http://localhost:3000/api
    description: Production server (via nginx)

tags:
  - name: terms
    description: Operations on glossary terms
  - name: relationships
    description: Operations on term relationships
  - name: graph
    description: Semantic graph operations

paths:
  /terms:
    get:
      tags:
        - terms
      summary: Get all terms
      description: Retrieve all glossary terms with optional search and filtering
      parameters:
        - name: search
          in: query
          description: Search query for term name or definition
          required: false
          schema:
            type: string
        - name: category
          in: query
          description: Filter by category
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Term'
        '500':
          description: Internal server error

    post:
      tags:
        - terms
      summary: Create a new term
      description: Add a new term to the glossary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTermRequest'
      responses:
        '201':
          description: Term created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Term'
        '400':
          description: Invalid request
        '500':
          description: Internal server error

  /terms/{id}:
    get:
      tags:
        - terms
      summary: Get term by ID
      description: Retrieve a specific term by its ID
      parameters:
        - name: id
          in: path
          required: true
          description: Term ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Term'
        '404':
          description: Term not found
        '500':
          description: Internal server error

    put:
      tags:
        - terms
      summary: Update a term
      description: Update an existing term
      parameters:
        - name: id
          in: path
          required: true
          description: Term ID
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTermRequest'
      responses:
        '200':
          description: Term updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Term'
        '400':
          description: Invalid request
        '404':
          description: Term not found
        '500':
          description: Internal server error

    delete:
      tags:
        - terms
      summary: Delete a term
      description: Delete a term from the glossary
      parameters:
        - name: id
          in: path
          required: true
          description: Term ID
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Term deleted successfully
        '404':
          description: Term not found
        '500':
          description: Internal server error

  /relationships:
    get:
      tags:
        - relationships
      summary: Get all relationships
      description: Retrieve all term relationships
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Relationship'
        '500':
          description: Internal server error

    post:
      tags:
        - relationships
      summary: Create a new relationship
      description: Create a relationship between two terms
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRelationshipRequest'
      responses:
        '201':
          description: Relationship created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Relationship'
        '400':
          description: Invalid request
        '500':
          description: Internal server error

  /relationships/{id}:
    delete:
      tags:
        - relationships
      summary: Delete a relationship
      description: Delete a relationship between terms
      parameters:
        - name: id
          in: path
          required: true
          description: Relationship ID
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Relationship deleted successfully
        '404':
          description: Relationship not found
        '500':
          description: Internal server error

  /graph:
    get:
      tags:
        - graph
      summary: Get semantic graph
      description: Retrieve the complete semantic graph with all terms and relationships
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Graph'
        '500':
          description: Internal server error

components:
  schemas:
    Term:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier
        name:
          type: string
          description: Term name
        definition:
          type: string
          description: Term definition
        category:
          type: string
          description: Category of the term
        source:
          type: string
          description: Source of the definition
        source_url:
          type: string
          description: URL to the source
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp

    CreateTermRequest:
      type: object
      required:
        - name
        - definition
        - category
      properties:
        name:
          type: string
          description: Term name
        definition:
          type: string
          description: Term definition
        category:
          type: string
          description: Category of the term
        source:
          type: string
          description: Source of the definition
        source_url:
          type: string
          description: URL to the source

    UpdateTermRequest:
      type: object
      required:
        - name
        - definition
        - category
      properties:
        name:
          type: string
          description: Term name
        definition:
          type: string
          description: Term definition
        category:
          type: string
          description: Category of the term
        source:
          type: string
          description: Source of the definition
        source_url:
          type: string
          description: URL to the source

    Relationship:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier
        source_term_id:
          type: integer
          format: int64
          description: Source term ID
        target_term_id:
          type: integer
          format: int64
          description: Target term ID
        type:
          type: string
          description: Relationship type (e.g., related_to, part_of, depends_on)
        description:
          type: string
          description: Description of the relationship
        created_at:
          type: string
          format: date-time
          description: Creation timestamp

    CreateRelationshipRequest:
      type: object
      required:
        - source_term_id
        - target_term_id
        - type
      properties:
        source_term_id:
          type: integer
          format: int64
          description: Source term ID
        target_term_id:
          type: integer
          format: int64
          description: Target term ID
        type:
          type: string
          description: Relationship type
        description:
          type: string
          description: Description of the relationship

    Graph:
      type: object
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/GraphNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/GraphEdge'

    GraphNode:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        definition:
          type: string
        category:
          type: string

    GraphEdge:
      type: object
      properties:
        id:
          type: integer
          format: int64
        source:
          type: integer
          format: int64
        target:
          type: integer
          format: int64
        type:
          type: string
        description:
          type: string

