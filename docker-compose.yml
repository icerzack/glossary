version: '3.8'

services:
  glossary:
    build:
      context: .
      dockerfile: Dockerfile
      cache_from:
        - glossary-app:latest
    container_name: glossary-app
    ports:
      - "${NGINX_PORT:-3000}:${NGINX_PORT:-3000}"
      - "${BACKEND_PORT:-8080}:${BACKEND_PORT:-8080}"
    volumes:
      - glossary-data:/data
    environment:
      - PORT=${BACKEND_PORT:-8080}
      - NGINX_PORT=${NGINX_PORT:-3000}
      - DB_PATH=/data/glossary.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${BACKEND_PORT:-8080}/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  glossary-data:
    driver: local

